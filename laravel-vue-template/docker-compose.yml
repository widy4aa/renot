services:

  # ── PostgreSQL Database ─────────────────────────────────────
  db:
    image: docker.io/postgres:16-alpine
    container_name: renot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-renot}
    # Port TIDAK di-expose ke host — hanya accessible dari container network
    # Untuk akses manual: podman-compose exec db psql -U root -d renot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d renot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Laravel + Vue App ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs

volumes:
  pgdata:
    driver: local
  storage_public:
    driver: local
  storage_logs:
    driver: local
