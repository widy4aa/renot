server {
    listen 8000;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Charset & max body size
    charset utf-8;
    client_max_body_size 20M;

    # Logs ke stdout/stderr agar muncul di podman logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Static assets — cache aggressif ──────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|ico|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Storage public (upload file) ─────────────────────────
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Laravel SPA catch-all ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Deny dotfiles ─────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
